[project]
name = "sidetap-live"
version = "0.1.0"
description = "Single-box real-time voice interpretation for any call, captured from PipeWire"
requires-python = ">=3.13"

dependencies = [
    # Floors are the versions actually exercised, not the oldest that might
    # work. google-genai's Live surface is preview and has already moved
    # under this project once: docs/experiments/01-connect.md exists because
    # translation_config is a TOP-LEVEL field of LiveConnectConfig in 2.24.0
    # while the REST docs nest it under generationConfig - and the nested
    # form still type-checks, connects, and silently produces a chatbot.
    # >=1.0.0 admitted 24 major versions nobody here has ever run.
    "google-genai>=2.24.0",
    "webrtcvad-wheels>=2.0.14",
    "textual>=8.2.8",
]

[project.scripts]
sidetap-live = "sidetap_live.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sidetap_live"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Deliberately narrow. The rules left out are left out on purpose:
#   BLE001 blind-except  - the watchers catch Exception by design, so that a
#                          transient graph read cannot kill a thread that must
#                          survive the whole call.
#   S110   try-except-pass - same shape, same reason.
#   SIM115 open-without-context-manager - the transcript's .jsonl handle is
#                          deliberately long-lived and closed in close().
#   E501   line-too-long - the comments here carry the reasoning behind the
#                          measurements and are wrapped by hand.
# A linter that flags the design is a linter that gets switched off.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests import next to the group of tests that use them, which reads better
# than one block at the top of a 700-line file.
"tests/*" = ["E402"]
